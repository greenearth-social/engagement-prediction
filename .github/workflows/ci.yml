name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PIPENV_PIPFILE: Pipfile.cpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.11"

      - name: Install Pipenv
        run: python -m pip install pipenv==2026.5.2

      - name: Verify env sync
        run: |
          python ops/check_env_sync.py
          PIPENV_PIPFILE=Pipfile pipenv verify
          pipenv verify

      - name: Install env from lockfile
        run: pipenv sync --dev

      - name: Run pytest
        run: pipenv run pytest
