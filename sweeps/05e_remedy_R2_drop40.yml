# Sweep 05e — Remedy R2: drop top-40% power-likers from training targets
#
# Round 2: extends the R2 ladder to 40% to map the bias-utility knee.
# Dropping 40% removes all users with >= 61 likes.
#
# No per-like cap (cap_inf) — isolates the user-level remedy.
# Cells: MLP 5 seeds + two-tower 3 seeds = 8 cells + Phase A.
#
# Parent job: 260608_power_likers/jobs/0004_remedy_round2.md

sweep_name: 05e_remedy_R2_drop40

ingestion_run: outputs/0015_stage1_fixc_v2_20260512_054231

caps:
  - null

architectures:
  - {model_type: mlp,       user_encoder: summarized,     user_summarization: ema, ema_alpha: 0.1}
  - {model_type: two-tower, user_encoder: cross_attention}

seeds: [1, 2, 3, 4, 5]

epochs: 100
batch_size: 4096
patience: 20
max_parallel_mlp: 2
skip_holdout_pred_during_train: true

extra_cli_args:
  - --train-start
  - "2026-03-01"
  - --val-start
  - "2026-04-16"
  - --holdout-start
  - "2026-04-21"
  - --holdout-user-fraction
  - "0.0909"
  - --exclude-users-file
  - "/mnt/data/wm.s.schulz/modules/engagement-prediction/analyses/remedies/artifacts/exclude_top40pct.parquet"
  - --experiment-tracker
  - "none"
