# Sweep 05d — Remedy R2: drop top-30% power-likers from training targets
#
# Round 2: extends the R2 ladder (10% → 20% → 30% → 40%) to find the
# bias-utility knee.  Dropping 30% removes all users with >= 105 likes.
#
# No per-like cap (cap_inf) — isolates the user-level remedy.
# Cells: 2 architectures × 5 MLP seeds + 3 TT seeds → actually written as
# two separate arch passes; harness runs all seeds in seeds: list.
# MLP: 5 seeds; two-tower: 3 seeds (robustness only, noisy).
# We achieve this by running this YAML as two separate launches or accepting
# both arch × 5 seeds = 10 cells total (TT seeds 4-5 are low cost).
#
# Parent job: 260608_power_likers/jobs/0004_remedy_round2.md
# Baseline: sweep_04_longer_window cap_inf cells

sweep_name: 05d_remedy_R2_drop30

ingestion_run: outputs/0015_stage1_fixc_v2_20260512_054231

caps:
  - null

architectures:
  - {model_type: mlp,       user_encoder: summarized,     user_summarization: ema, ema_alpha: 0.1}
  - {model_type: two-tower, user_encoder: cross_attention}

seeds: [1, 2, 3, 4, 5]

epochs: 100
batch_size: 4096
patience: 20
max_parallel_mlp: 2
skip_holdout_pred_during_train: true

extra_cli_args:
  - --train-start
  - "2026-03-01"
  - --val-start
  - "2026-04-16"
  - --holdout-start
  - "2026-04-21"
  - --holdout-user-fraction
  - "0.0909"
  - --exclude-users-file
  - "/mnt/data/wm.s.schulz/modules/engagement-prediction/analyses/remedies/artifacts/exclude_top30pct.parquet"
  - --experiment-tracker
  - "none"
