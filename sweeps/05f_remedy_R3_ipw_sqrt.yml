# Sweep 05f — Remedy R3b: 1/sqrt(n_likes) inverse-sqrt weighting
#
# Round 2: mechanism-correct IPW intermediate.  Weight ~ 1/sqrt(n_likes),
# normalized to mean=1.  Total per-user gradient mass ~ sqrt(n_likes), which
# lies between inv_log (~linear, no-op) and inv_likes (flat, one-user-one-vote).
# Tests whether partial equalization partially matches the R2 drop effect.
#
# No per-like cap (cap_inf) — isolates the user-level remedy.
# Cells: MLP 5 seeds + two-tower 3 seeds.
#
# Parent job: 260608_power_likers/jobs/0004_remedy_round2.md

sweep_name: 05f_remedy_R3_ipw_sqrt

ingestion_run: outputs/0015_stage1_fixc_v2_20260512_054231

caps:
  - null

architectures:
  - {model_type: mlp,       user_encoder: summarized,     user_summarization: ema, ema_alpha: 0.1}
  - {model_type: two-tower, user_encoder: cross_attention}

seeds: [1, 2, 3, 4, 5]

epochs: 100
batch_size: 4096
patience: 20
max_parallel_mlp: 2
skip_holdout_pred_during_train: true

extra_cli_args:
  - --train-start
  - "2026-03-01"
  - --val-start
  - "2026-04-16"
  - --holdout-start
  - "2026-04-21"
  - --holdout-user-fraction
  - "0.0909"
  - --user-weight-mode
  - "inv_sqrt_likes"
  - --experiment-tracker
  - "none"
