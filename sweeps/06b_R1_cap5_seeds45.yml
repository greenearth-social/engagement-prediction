# Sweep 06b — Seed top-up: R1 cap=5, MLP seeds 4-5
#
# Adds seeds 4 and 5 to the R1_cap5 condition (per-like cap=5).
# Same config as sweep_04_longer_window cap_5 cells.

sweep_name: 06b_R1_cap5_seeds45

ingestion_run: outputs/0015_stage1_fixc_v2_20260512_054231

caps:
  - 5

architectures:
  - {model_type: mlp, user_encoder: summarized, user_summarization: ema, ema_alpha: 0.1}

seeds: [4, 5]

epochs: 100
batch_size: 4096
patience: 20
max_parallel_mlp: 2
skip_holdout_pred_during_train: true

extra_cli_args:
  - --train-start
  - "2026-03-01"
  - --val-start
  - "2026-04-16"
  - --holdout-start
  - "2026-04-21"
  - --holdout-user-fraction
  - "0.0909"
  - --experiment-tracker
  - "none"
