# Sweep 05g — Remedy R3c: 1/n_likes inverse weighting (one-user-one-vote)
#
# Round 2: mechanism-correct IPW fix.  Weight ~ 1/n_likes, normalized to mean=1.
# Each user's TOTAL gradient contribution is n_likes * (1/n_likes) = 1 regardless
# of like volume.  This is the "one user one vote" solution and the history-
# preserving analog of R2's hard user drop.
#
# If this matches R2's bias-reduction effect, it confirms that per-user gradient
# mass (not which users are present) is the operative mechanism.  If it does NOT
# match, dropping power-likers provides something beyond just equalizing mass —
# likely removing power-liker's preferred content from the training distribution
# entirely.
#
# No per-like cap (cap_inf) — isolates the user-level remedy.
# Cells: MLP 5 seeds + two-tower 3 seeds.
#
# Parent job: 260608_power_likers/jobs/0004_remedy_round2.md

sweep_name: 05g_remedy_R3_ipw_inv

ingestion_run: outputs/0015_stage1_fixc_v2_20260512_054231

caps:
  - null

architectures:
  - {model_type: mlp,       user_encoder: summarized,     user_summarization: ema, ema_alpha: 0.1}
  - {model_type: two-tower, user_encoder: cross_attention}

seeds: [1, 2, 3, 4, 5]

epochs: 100
batch_size: 4096
patience: 20
max_parallel_mlp: 2
skip_holdout_pred_during_train: true

extra_cli_args:
  - --train-start
  - "2026-03-01"
  - --val-start
  - "2026-04-16"
  - --holdout-start
  - "2026-04-21"
  - --holdout-user-fraction
  - "0.0909"
  - --user-weight-mode
  - "inv_likes"
  - --experiment-tracker
  - "none"
